project_id = "app-produtividade"

[api]
enabled = true
port = 54321
# `produtividade` e `wishlist`: um schema por app, desde a consolidação dos dois
# projetos Supabase num só. `private` fica fora de propósito — é acessado só por
# conexão direta ao Postgres nas Edge Functions (ver functions/_shared/google.ts).
schemas = ["produtividade", "wishlist", "public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://app-produtividade-3ec9d.web.app"]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
