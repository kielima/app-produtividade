name: Sync Anthropic secret + deploy call-claude

# Leva a chave da API da Anthropic do secret do REPOSITÓRIO (GitHub) para os
# secrets da Edge Function `call-claude` no Supabase, e publica a função.
#
# Por que esse caminho: um secret do GitHub só existe dentro dos workflows —
# o app (navegador/APK) não consegue lê-lo, e nem deve: a chave tem de ficar
# num servidor. Quem chama a Anthropic é a Edge Function; este workflow é a
# ponte. A chave nunca entra no código nem no bundle do app. Ver docs/IA.md.
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY      a chave (console.anthropic.com → API Keys)
#   SUPABASE_ACCESS_TOKEN  token pessoal do Supabase
#                          (supabase.com/dashboard/account/tokens)
#
# Roda sozinho quando a função muda no main, e à mão (Run workflow) depois de
# criar ou trocar a chave.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/call-claude/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/sync-anthropic-secret.yml'

concurrency:
  group: sync-anthropic-secret
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: robwqxgllzxbxwnjkyic

jobs:
  sync:
    name: Secret + deploy
    runs-on: ubuntu-latest
    steps:
      - name: Conferir secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          falta=0
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Falta o secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions)."
            falta=1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o secret SUPABASE_ACCESS_TOKEN (crie em supabase.com/dashboard/account/tokens)."
            falta=1
          fi
          exit $falta

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Gravar ANTHROPIC_API_KEY nos secrets das Edge Functions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Via arquivo temporário (fora do repositório), para a chave não
        # aparecer na linha de comando nem no log.
        run: |
          f="$(mktemp)"
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > "$f"
          supabase secrets set --env-file "$f" --project-ref "$SUPABASE_PROJECT_REF"
          rm -f "$f"

      - name: Publicar a função call-claude
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy call-claude --project-ref "$SUPABASE_PROJECT_REF" --use-api
